<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Brand tokens: replace with the product's colours. */
      :root {
        --brand: #00949d;
        --ink: #02191a;
        --paper: #f4f8f8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ink);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: Inter, sans-serif;
      }
      #bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(1100px 700px at 75% 25%, rgba(0, 148, 157, 0.18), transparent 70%),
          var(--ink);
      }
    </style>
  </head>
  <body>
    <!-- Starter film: hook (one-word screens) → chapter card → UI scene (camera + cursor) → outro.
         Each scene is a sub-composition; set data-start/data-duration from the narration. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="22" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="22" data-track-index="0"></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="chapter" data-composition-id="chapter" data-composition-src="compositions/chapter.html" data-start="4.6" data-duration="3.6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="ui-focus" data-composition-id="ui-focus" data-composition-src="compositions/ui-focus.html" data-start="8.2" data-duration="10" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="outro" data-composition-id="outro" data-composition-src="compositions/outro.html" data-start="18.2" data-duration="3.8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <!-- Audio goes here: narration (one track), music bed at ~0.16, effects on visible actions. -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
