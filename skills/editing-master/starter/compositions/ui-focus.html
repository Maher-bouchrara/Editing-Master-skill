  <div id="root" data-composition-id="ui-focus" data-width="1920" data-height="1080">

      <div id="uf-cam">
        <div id="uf-win">
          <div class="uf-bar">Your app</div>
          <div class="uf-row">Protection<span class="uf-sw" id="sw1"><i></i></span></div>

  <script>
    const tl = gsap.timeline({ paused: true });
    // Camera: put point (cx, cy) at the screen centre, scaled by s. #uf-cam has origin 0 0.
    const focus = (cx, cy, s) => ({ x: 960 - cx * s, y: 540 - cy * s, scale: s });
    tl.set("#uf-cam", { transformOrigin: "0px 0px" }, 0);
    // The switch of the first row sits at about (1452, 281) on the stage.
    const SW = [1452, 281];

    tl.fromTo("#uf-win", { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 0.2);
    // Step chip: appears at the new step, then leaves so it never covers the UI.
    tl.fromTo("#uf-chip", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 0.8);
    tl.to("#uf-chip", { opacity: 0, duration: 0.3 }, 3.4);

    // Push in on the control the voice names.
    tl.to("#uf-cam", { ...focus(SW[0] - 200, SW[1] + 40, 1.8), duration: 0.9, ease: "power3.inOut" }, 1.6);
    // Cursor moves with intent and arrives just before the word.
    tl.fromTo("#uf-cursor", { opacity: 0, x: 1150, y: 520 }, { opacity: 1, duration: 0.2 }, 2.4);
    tl.to("#uf-cursor", { x: SW[0], y: SW[1], duration: 0.7, ease: "power2.inOut" }, 2.6);
    // Click on the word: cursor press, ripple, ONE state change.
    tl.to("#uf-cursor", { scale: 0.85, duration: 0.1, yoyo: true, repeat: 1 }, 3.4);
    tl.fromTo("#uf-ripple", { x: SW[0], y: SW[1], opacity: 0.9, scale: 0.3 }, { scale: 1.6, opacity: 0, duration: 0.5, ease: "power2.out" }, 3.4);
    tl.to("#sw1", { backgroundColor: "#00949d", duration: 0.2 }, 3.45);
    tl.to("#sw1 i", { x: 38, duration: 0.2, ease: "power2.out" }, 3.45);
    // Hold 1.5 s after the action so it can be seen, then pull back.
    tl.to("#uf-cam", { x: 0, y: 0, scale: 1, duration: 0.9, ease: "power3.inOut" }, 5.2);
    tl.to("#uf-cursor", { opacity: 0, duration: 0.2 }, 5.2);
    // Exit: blur out.
    tl.to("#uf-stage", { opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 9.6);
    window.__timelines["ui-focus"] = tl;
  </script>
